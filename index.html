<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vampire World Map</title>
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.css' />
    <link rel="stylesheet" href="style.css">
    <script src='https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>

<script type="module" src="map.js"></script>


<!--Sidebar-->
<div id="bioSideBar" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <p id="name">name</p>
    <div class="meta">
        <div id="region"></div>
        <div id="year"></div>
    </div>
    <div class="imageDescription">
        <img id="images" src="images/defaultVampire.png" alt="Default Vampire">
        <p id="physicalDescription">physicalDescription</p>
    </div>


    <p id="powers">powers</p>
    <p id="weaknesses">weaknesses</p>
    <p id="feedingMethod">feedingMethod</p>
    <p id="culturalContext">culturalContext</p>
    <p id="origin">origin</p>
    <p id="sources">sources</p>
    <p id="notes">notes</p>
    <p id="seeAlso">seeAlso</p>
</div>


</body>
</html>
