<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vampire World Map</title>
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.css' />
    <link rel="stylesheet" href="style.css">
    <script src='https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>

<script type="module" src="map.js"></script>


<!--Sidebar-->
<div id="bioSideBar" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <p id="name">name</p>
    <div class="meta">
        <div id="region"></div>
        <div id="year"></div>
    </div>
    <div class="imageDescription">
        <div class="imageControls">
            <img id="images" src="images/Vampire1.png" alt="Default Vampire">
            <div class="arrows">
                <a href="javascript:void(0)" class="prevImage" onclick="prevImage()">&larr;</a>
                <a href="javascript:void(0)" class="nextImage" onclick="nextImage()">&rarr;</a>
            </div>
        </div>
        <p id="physicalDescription">physicalDescription</p>
    </div>

    <div id="Feeding">
        <p id="feedingTitle"> Feeding Method</p>
        <p id="feedingMethod">feedingMethod</p>
    </div>

    <div id="powersAndWeaknesses">
        <div id="powersSection">
            <p id="powersTitle"> Powers</p>
            <ul id="powers"></ul>
        </div>
        <div id="weaknessesSection">
            <p id="weaknessesTitle"> Weaknesses</p>
            <ul id="weaknesses"></ul>
        </div>
    </div>

    <div id="culturalInfo">
        <div id="culturalContextSection" class="half">
            <p id="culturalContextTitle">Cultural Context</p>
            <p id="culturalContext">Cultural Context</p>
        </div>

        <div id="originSection" class="half">
            <p id="originTitle">Origin</p>
            <p id="origin">Origin</p>
        </div>
    </div>

<!--    <div id="notesSection">-->
<!--        <p class="title">Notes</p>-->
<!--        <p id="notes"></p>-->
<!--    </div>-->

<!--    <div id="seeAlsoSection">-->
<!--        <p class="title">See Also</p>-->
<!--        <p id="seeAlso"></p>-->
<!--    </div>-->

    <p id="sources">sources</p>

</div>


</body>
</html>
